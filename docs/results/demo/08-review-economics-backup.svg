<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Inference cost is not the whole business case."><title>Inference cost is not the whole business case.</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#071421"/><rect x="78" y="66" width="9" height="77" rx="4" fill="#52E4BA"/><text x="108" y="106" font-family="Arial,Helvetica,sans-serif" font-size="52" fill="#F4F6FA" font-weight="700" text-anchor="start">Inference cost is not the whole business case.</text><text x="108" y="155" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#AFC2D4" font-weight="400" text-anchor="start">Stakeholder backup  |  More false alerts can outweigh model-token savings</text><rect x="80" y="208" width="1440" height="568" rx="20" fill="#10253A"/><text x="116" y="263" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#AFC2D4" font-weight="700" text-anchor="start">AN ILLUSTRATIVE 1,000-INVOICE COST CHECK</text><text x="116" y="344" font-family="Arial,Helvetica,sans-serif" font-size="79" fill="#52E4BA" font-weight="700" text-anchor="start">$8.44</text><text x="451" y="326" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#AFC2D4" font-weight="400" text-anchor="start">model inference savings</text><text x="451" y="360" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#7895AA" font-weight="400" text-anchor="start">$9.20 - $0.76</text><line x1="114" y1="393" x2="1487" y2="393" stroke="#29455C" stroke-width="2"/><text x="116" y="482" font-family="Arial,Helvetica,sans-serif" font-size="79" fill="#FFAB7D" font-weight="700" text-anchor="start">+$260</text><text x="451" y="464" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#AFC2D4" font-weight="400" text-anchor="start">additional manual-review cost</text><text x="451" y="498" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#7895AA" font-weight="400" text-anchor="start">26 extra false alerts × $10 per review (assumed)</text><line x1="114" y1="529" x2="1487" y2="529" stroke="#29455C" stroke-width="2"/><text x="116" y="628" font-family="Arial,Helvetica,sans-serif" font-size="72" fill="#FFAB7D" font-weight="700" text-anchor="start">+$251.56</text><text x="550" y="604" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#F4F6FA" font-weight="700" text-anchor="start">illustrative net increase</text><text x="550" y="643" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#AFC2D4" font-weight="400" text-anchor="start">Model cost + incremental false-alert review cost</text><rect x="113" y="707" width="1357" height="44" rx="10" fill="#163249"/><text x="790" y="737" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#AFC2D4" font-weight="600" text-anchor="middle">Does not include missed discrepancies, other review work, or infrastructure costs.</text><line x1="78" y1="822" x2="1520" y2="822" stroke="#29455C" stroke-width="2"/><text x="80" y="856" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#7895AA" font-weight="400" text-anchor="start">$10 review cost comes from the synthetic policy; this is NOT a measured real-world operating cost.</text><text x="1518" y="856" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#52E4BA" font-weight="700" text-anchor="end">FIREWORKS  /  BUILDATHON</text></svg>
