<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The model reads. The harness verifies."><title>The model reads. The harness verifies.</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#071421"/><rect x="78" y="66" width="9" height="77" rx="4" fill="#52E4BA"/><text x="108" y="106" font-family="Arial,Helvetica,sans-serif" font-size="52" fill="#F4F6FA" font-weight="700" text-anchor="start">The model reads. The harness verifies.</text><text x="108" y="155" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#AFC2D4" font-weight="400" text-anchor="start">No free-roaming agents or autonomous payments  •  Explicit checks outside the language model</text><rect x="80" y="280" width="225" height="277" rx="18" fill="#10253A"/><rect x="80" y="280" width="225" height="8" rx="4" fill="#77BDF9"/><text x="97" y="328" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#77BDF9" font-weight="700" text-anchor="start">01 / EVIDENCE</text><text x="97" y="394" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F4F6FA" font-weight="700" text-anchor="start">Four documents</text><text x="97" y="447" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#AFC2D4" font-weight="400" text-anchor="start">PO · ASN · GR · Invoice</text><text x="313" y="429" font-family="Arial,Helvetica,sans-serif" font-size="54" fill="#52E4BA" font-weight="700" text-anchor="start">›</text><rect x="324" y="280" width="226" height="277" rx="18" fill="#10253A"/><rect x="324" y="280" width="226" height="8" rx="4" fill="#52E4BA"/><text x="341" y="328" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#52E4BA" font-weight="700" text-anchor="start">02 / READER</text><text x="341" y="394" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F4F6FA" font-weight="700" text-anchor="start">GLM 5.3 Flash</text><text x="341" y="447" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#AFC2D4" font-weight="400" text-anchor="start">Extracts raw facts</text><text x="558" y="429" font-family="Arial,Helvetica,sans-serif" font-size="54" fill="#52E4BA" font-weight="700" text-anchor="start">›</text><rect x="569" y="280" width="226" height="277" rx="18" fill="#10253A"/><rect x="569" y="280" width="226" height="8" rx="4" fill="#52E4BA"/><text x="586" y="328" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#52E4BA" font-weight="700" text-anchor="start">03 / CHECKS</text><text x="586" y="394" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F4F6FA" font-weight="700" text-anchor="start">Deterministic code</text><text x="586" y="447" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#AFC2D4" font-weight="400" text-anchor="start">Matches · arithmetic</text><text x="803" y="429" font-family="Arial,Helvetica,sans-serif" font-size="54" fill="#52E4BA" font-weight="700" text-anchor="start">›</text><rect x="814" y="280" width="226" height="277" rx="18" fill="#10253A"/><rect x="814" y="280" width="226" height="8" rx="4" fill="#F7D47D"/><text x="831" y="328" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#F7D47D" font-weight="700" text-anchor="start">04 / MEMORY</text><text x="831" y="394" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F4F6FA" font-weight="700" text-anchor="start">Company context</text><text x="831" y="447" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#AFC2D4" font-weight="400" text-anchor="start">History · wiki · policy</text><text x="1048" y="429" font-family="Arial,Helvetica,sans-serif" font-size="54" fill="#52E4BA" font-weight="700" text-anchor="start">›</text><rect x="1059" y="280" width="226" height="277" rx="18" fill="#10253A"/><rect x="1059" y="280" width="226" height="8" rx="4" fill="#52E4BA"/><text x="1076" y="328" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#52E4BA" font-weight="700" text-anchor="start">05 / DECIDE</text><text x="1076" y="394" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F4F6FA" font-weight="700" text-anchor="start">Business dial</text><text x="1076" y="447" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#AFC2D4" font-weight="400" text-anchor="start">Policy / review logic</text><text x="1293" y="429" font-family="Arial,Helvetica,sans-serif" font-size="54" fill="#52E4BA" font-weight="700" text-anchor="start">›</text><rect x="1304" y="280" width="216" height="277" rx="18" fill="#10253A"/><rect x="1304" y="280" width="216" height="8" rx="4" fill="#77BDF9"/><text x="1321" y="328" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#77BDF9" font-weight="700" text-anchor="start">06 / REVIEW</text><text x="1321" y="394" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F4F6FA" font-weight="700" text-anchor="start">Human analyst</text><text x="1321" y="447" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#AFC2D4" font-weight="400" text-anchor="start">Evidence + next action</text><rect x="79" y="622" width="1442" height="151" rx="16" fill="#163249"/><text x="113" y="676" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#52E4BA" font-weight="700" text-anchor="start">WHAT THE HARNESS ADDS</text><text x="113" y="727" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#F4F6FA" font-weight="400" text-anchor="start">Persistent context, executable comparisons, traceable exceptions and configurable review policy.</text><line x1="78" y1="822" x2="1520" y2="822" stroke="#29455C" stroke-width="2"/><text x="80" y="856" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#7895AA" font-weight="400" text-anchor="start">Current proof-of-concept: synthetic history and policy; verification does not equal payment authorization.</text><text x="1518" y="856" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#52E4BA" font-weight="700" text-anchor="end">FIREWORKS  /  BUILDATHON</text></svg>
