<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Less reasoning, better throughput."><title>Less reasoning, better throughput.</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#071421"/><rect x="78" y="66" width="9" height="77" rx="4" fill="#52E4BA"/><text x="108" y="106" font-family="Arial,Helvetica,sans-serif" font-size="52" fill="#F4F6FA" font-weight="700" text-anchor="start">Less reasoning, better throughput.</text><text x="108" y="155" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#AFC2D4" font-weight="400" text-anchor="start">GLM 5.3 Flash  |  Comparing default and low reasoning on the same 300 document cases</text><rect x="77" y="198" width="1445" height="583" rx="20" fill="#10253A"/><text x="112" y="250" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#52E4BA" font-weight="700" text-anchor="start">CONTROLLED COMPARISON  ·  FIRST 300 DOCUMENT CASES</text><text x="112" y="302" font-family="Arial,Helvetica,sans-serif" font-size="35" fill="#77BDF9" font-weight="700" text-anchor="start">Default reasoning</text><text x="912" y="302" font-family="Arial,Helvetica,sans-serif" font-size="35" fill="#52E4BA" font-weight="700" text-anchor="start">Low reasoning</text><text x="114" y="368" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#AFC2D4" font-weight="400" text-anchor="start">Median latency</text><text x="616" y="368" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#77BDF9" font-weight="700" text-anchor="end">22.2 s</text><text x="1011" y="368" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#52E4BA" font-weight="700" text-anchor="end">5.1 s</text><rect x="1127" y="337" width="340" height="44" rx="13" fill="#163249"/><text x="1298" y="366" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#52E4BA" font-weight="700" text-anchor="middle">4.4× faster</text><line x1="112" y1="392" x2="1484" y2="392" stroke="#29455C" stroke-width="1"/><text x="114" y="459" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#AFC2D4" font-weight="400" text-anchor="start">Model cost / 100</text><text x="616" y="459" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#77BDF9" font-weight="700" text-anchor="end">$0.29</text><text x="1011" y="459" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#52E4BA" font-weight="700" text-anchor="end">$0.08</text><rect x="1127" y="428" width="340" height="44" rx="13" fill="#163249"/><text x="1298" y="457" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#52E4BA" font-weight="700" text-anchor="middle">73% cheaper</text><line x1="112" y1="483" x2="1484" y2="483" stroke="#29455C" stroke-width="1"/><text x="114" y="550" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#AFC2D4" font-weight="400" text-anchor="start">True problems caught</text><text x="616" y="550" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#77BDF9" font-weight="700" text-anchor="end">117/117</text><text x="1011" y="550" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#52E4BA" font-weight="700" text-anchor="end">117/117</text><rect x="1127" y="519" width="340" height="44" rx="13" fill="#163249"/><text x="1298" y="548" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#52E4BA" font-weight="700" text-anchor="middle">same on 300</text><line x1="112" y1="574" x2="1484" y2="574" stroke="#29455C" stroke-width="1"/><text x="114" y="641" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#AFC2D4" font-weight="400" text-anchor="start">False alerts on fine invoices</text><text x="616" y="641" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#77BDF9" font-weight="700" text-anchor="end">20/148</text><text x="1011" y="641" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#52E4BA" font-weight="700" text-anchor="end">9/148</text><rect x="1127" y="610" width="340" height="44" rx="13" fill="#163249"/><text x="1298" y="639" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#52E4BA" font-weight="700" text-anchor="middle">11 fewer</text><rect x="113" y="737" width="1350" height="40" rx="9" fill="#163249"/><text x="788" y="765" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#FFAB7D" font-weight="600" text-anchor="middle">CONTEXT TEST: default caught 140/140; low reasoning 139/140  •  Tradeoff is not zero</text><line x1="78" y1="822" x2="1520" y2="822" stroke="#29455C" stroke-width="2"/><text x="80" y="856" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#7895AA" font-weight="400" text-anchor="start">The context comparison uses a separate 210-case test and is not the same 300-case document benchmark.</text><text x="1518" y="856" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#52E4BA" font-weight="700" text-anchor="end">FIREWORKS  /  BUILDATHON</text></svg>
