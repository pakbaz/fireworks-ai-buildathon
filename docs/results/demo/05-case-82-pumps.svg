<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="One invoice that changes the decision"><title>One invoice that changes the decision</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0B1424" /><rect x="76" y="72" width="8" height="74" rx="4" fill="#55D6C2" /><text x="107" y="105" font-size="50" font-family="Arial,Helvetica,sans-serif" fill="#F5F7FB" font-weight="700" >One invoice that changes the decision</text><text x="107" y="151" font-size="24" font-family="Arial,Helvetica,sans-serif" fill="#A9B8C9" font-weight="400" >All four documents agree  |  Supplier-history quantity spike  |  Synthetic invoice $396,506.08</text><rect x="79" y="193" width="1440" height="585" rx="20" fill="#152238" /><text x="119" y="257" font-size="26" font-family="Arial,Helvetica,sans-serif" fill="#A9B8C9" font-weight="700" >CASE TESTCTX-0149 · NORTHSIDE HOSPITAL</text><text x="119" y="341" font-size="116" font-family="Arial,Helvetica,sans-serif" fill="#F5F7FB" font-weight="700" >82</text><text x="325" y="332" font-size="36" font-family="Arial,Helvetica,sans-serif" fill="#F5F7FB" font-weight="600" >infusion pumps invoiced</text><text x="125" y="395" font-size="29" font-family="Arial,Helvetica,sans-serif" fill="#A9B8C9" font-weight="400" >Supplier&apos;s historical maximum: 11</text><rect x="120" y="450" width="1335" height="31" rx="16" fill="#192B42" /><rect x="120" y="450" width="537.2560975609756" height="31" rx="16" fill="#FFD381" /><rect x="657.2560975609756" y="450" width="797.7439024390244" height="31" rx="0" fill="#FF9678" /><text x="120" y="430" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#A9B8C9" font-weight="400" >0</text><text x="657.2560975609756" y="430" font-size="23" font-family="Arial,Helvetica,sans-serif" fill="#FFD381" font-weight="700" text-anchor="middle">3 × 11 = 33 threshold</text><text x="1450" y="430" font-size="23" font-family="Arial,Helvetica,sans-serif" fill="#FF9678" font-weight="700" text-anchor="end">82 invoiced</text><rect x="119" y="540" width="635" height="184" rx="16" fill="#192B42" /><rect x="782" y="540" width="697" height="184" rx="16" fill="#192B42" /><text x="151" y="588" font-size="22" font-family="Arial,Helvetica,sans-serif" fill="#83ADFF" font-weight="700" >KIMI K3 ALONE</text><text x="151" y="657" font-size="52" font-family="Arial,Helvetica,sans-serif" fill="#FF9678" font-weight="700" >PAY</text><text x="151" y="695" font-size="22" font-family="Arial,Helvetica,sans-serif" fill="#A9B8C9" font-weight="400" >Said 82 was below threshold</text><text x="810" y="588" font-size="22" font-family="Arial,Helvetica,sans-serif" fill="#55D6C2" font-weight="700" >GLM + DETERMINISTIC CHECKS</text><text x="810" y="657" font-size="52" font-family="Arial,Helvetica,sans-serif" fill="#55D6C2" font-weight="700" >ESCALATE</text><text x="810" y="695" font-size="22" font-family="Arial,Helvetica,sans-serif" fill="#A9B8C9" font-weight="400" >82 exceeds 33; analyst investigates</text><line x1="78" y1="822" x2="1520" y2="822" stroke="#2F4158" stroke-width="2"/><text x="80" y="853" font-size="19" font-family="Arial,Helvetica,sans-serif" fill="#A9B8C9" font-weight="400" >Example source: examples/demo/TESTCTX-0149.json · Decisions are recommendations, not payment transactions.</text><text x="1460" y="853" font-size="18" font-family="Arial,Helvetica,sans-serif" fill="#55D6C2" font-weight="700" text-anchor="end">FIREWORKS</text></svg>
