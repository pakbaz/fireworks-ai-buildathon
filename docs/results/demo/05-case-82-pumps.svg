<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="One case shows the value of verification."><title>One case shows the value of verification.</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#071421"/><rect x="78" y="66" width="9" height="77" rx="4" fill="#52E4BA"/><text x="108" y="106" font-family="Arial,Helvetica,sans-serif" font-size="52" fill="#F4F6FA" font-weight="700" text-anchor="start">One case shows the value of verification.</text><text x="108" y="155" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#AFC2D4" font-weight="400" text-anchor="start">All four invoice documents agree  •  Supplier history exposes the 82-versus-11 quantity anomaly</text><rect x="79" y="202" width="1440" height="565" rx="20" fill="#10253A"/><text x="116" y="249" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#AFC2D4" font-weight="700" text-anchor="start">CASE  TESTCTX-0149  ·  NORTHSIDE HOSPITAL SUPPLY</text><text x="116" y="351" font-family="Arial,Helvetica,sans-serif" font-size="118" fill="#F4F6FA" font-weight="700" text-anchor="start">82</text><text x="321" y="342" font-family="Arial,Helvetica,sans-serif" font-size="38" fill="#F4F6FA" font-weight="600" text-anchor="start">infusion pumps invoiced</text><text x="120" y="395" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#AFC2D4" font-weight="400" text-anchor="start">Largest previous order: 11 pumps</text><text x="1474" y="395" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F7D47D" font-weight="700" text-anchor="end">Rule: quantity &gt; 3 × historical max</text><rect x="117" y="441" width="1370" height="24" rx="12" fill="#163249"/><rect x="117" y="441" width="551.3414634146342" height="24" rx="12" fill="#F7D47D"/><rect x="668.3414634146342" y="441" width="818.6585365853658" height="24" rx="0" fill="#FFAB7D"/><text x="668.3414634146342" y="428" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F7D47D" font-weight="700" text-anchor="middle">33 threshold</text><text x="1482" y="428" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#FFAB7D" font-weight="700" text-anchor="end">82 billed</text><rect x="118" y="527" width="653" height="197" rx="15" fill="#163249"/><text x="146" y="576" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#FFAB7D" font-weight="700" text-anchor="start">KIMI K3 ALONE</text><text x="146" y="638" font-family="Arial,Helvetica,sans-serif" font-size="44" fill="#FFAB7D" font-weight="700" text-anchor="start">RECOMMENDS PAY</text><text x="146" y="691" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#AFC2D4" font-weight="400" text-anchor="start">Incorrectly judged 82 below threshold</text><rect x="800" y="527" width="687" height="197" rx="15" fill="#163249"/><text x="828" y="576" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#52E4BA" font-weight="700" text-anchor="start">GLM + DETERMINISTIC CHECKS</text><text x="828" y="638" font-family="Arial,Helvetica,sans-serif" font-size="44" fill="#52E4BA" font-weight="700" text-anchor="start">ESCALATE</text><text x="828" y="691" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#AFC2D4" font-weight="400" text-anchor="start">Flags quantity_spike for human review</text><line x1="78" y1="822" x2="1520" y2="822" stroke="#29455C" stroke-width="2"/><text x="80" y="856" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#7895AA" font-weight="400" text-anchor="start">Synthetic invoice $396,506.08 = potential exposure, NOT verified fraud or prevented loss.</text><text x="1518" y="856" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#52E4BA" font-weight="700" text-anchor="end">FIREWORKS  /  BUILDATHON</text></svg>
